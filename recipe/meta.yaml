{% set name = "pipestat" %}
{% set version = "0.14.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pipestat-{{ version }}.tar.gz
  sha256: 1c329cd697424a5a4ee8bbd5642ab08c6f5ce52bc5e6554efecdfd3d75ac6160

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - pipestat = pipestat.__main__:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - setuptools
    - jsonschema
    - logmuse >=0.2.5
    - ubiquerg >=0.8.0
    - yacman >=0.9.3
    - pyyaml
    - pandas
    - eido
    - jinja2

test:
  imports:
    - pipestat
  commands:
    - pipestat --help

about:
  home: "https://github.com/pepkit/pipestat"
  summary: "A pipeline results reporter."
  license: "BSD-2-Clause"
  license_family: BSD
  license_file: LICENSE
  doc_url: "https://pipestat.databio.org/en/latest"
  dev_url: "https://github.com/pepkit/pipestat"

extra:
  recipe-maintainers:
    - mencian
    - nsheff
